on:
  workflow_dispatch:

jobs:
  zip-files:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the files uploaded to the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Bundle the repository files into a ZIP archive
      - name: Archive Files
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'hugo-gda.dreamm'
          exclusions: 'README.md *.git* /*.github/*'

      # Step 3: Upload the ZIP file as a downloadable GitHub artifact
      - name: Upload Raw File
        uses: actions/upload-artifact@v7
        with:
          name: hugo-gda.dreamm
          path: hugo-gda.dreamm
          archive: false
